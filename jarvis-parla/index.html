<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Parla con Jarvis</title>
<style>
  /* Stesso HUD delle altre web app di Jarvis: nero trasparente sulla lente, ciano che brilla, 600×600. */
  :root {
    --ciano:#3fd4ff; --ciano-t:#3fd4ff55; --ciano-f:#3fd4ff22; --testo:#e8f7ff; --tenue:#8fb3c4; --rosso:#ff5a4e; --verde:#5ef0a8;
    --mono:"SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans:"SF Pro Display", -apple-system, "Roboto", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:var(--testo); font:20px/1.3 var(--sans); touch-action:none; }
  #app { position:relative; display:flex; flex-direction:column; height:100%; padding:18px 22px 14px; }
  #app::before, #app::after { content:""; position:absolute; width:34px; height:34px; border:2px solid var(--ciano); opacity:.7; }
  #app::before { top:6px; left:6px; border-right:0; border-bottom:0; }
  #app::after { bottom:6px; right:6px; border-left:0; border-top:0; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .reattore { width:52px; height:52px; flex:none; }
  .reattore .anello { transform-origin:50% 50%; animation:gira 12s linear infinite; }
  .reattore .anello2 { transform-origin:50% 50%; animation:gira 20s linear infinite reverse; }
  .pensa .reattore .anello { animation-duration:1.6s; } .pensa .reattore .anello2 { animation-duration:2.4s; }
  @keyframes gira { to { transform:rotate(360deg); } }
  .marchio { flex:1; }
  h1 { font:700 23px/1 var(--sans); letter-spacing:6px; color:var(--ciano); text-shadow:0 0 10px var(--ciano-t); }
  .sotto { font:12px/1.7 var(--mono); letter-spacing:2px; color:var(--tenue); }
  #ora { font:600 24px/1 var(--mono); }
  #domanda { width:100%; font:600 20px/1.3 var(--sans); color:var(--testo); background:transparent; border:1px solid var(--ciano-t);
    padding:12px 16px; border-radius:0; clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px); }
  #domanda::placeholder, #domanda2::placeholder { color:var(--ciano); opacity:.9; }
  #domanda2 { width:100%; margin-top:8px; resize:none; font:600 17px/1.3 var(--sans); color:var(--testo); background:transparent;
    border:1px dashed var(--ciano-t); padding:8px 14px; }
  #domanda2:focus { outline:none; border:2px solid var(--ciano); box-shadow:0 0 14px var(--ciano-t); }
  #diagnosi { font:11px/1.3 var(--mono); color:var(--tenue); letter-spacing:.5px; margin-top:4px; }
  .riga-domanda { display:flex; gap:8px; align-items:stretch; }
  .riga-domanda #domanda { flex:1; min-width:0; }
  #invia { flex:none; font:700 15px/1 var(--mono); letter-spacing:2px; color:#00141c; background:var(--ciano); border:0; padding:0 14px;
    clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
  #invia:focus { outline:2px solid var(--testo); }
  #ricevuto { font:13px/1.4 var(--mono); color:var(--verde); letter-spacing:1px; margin-top:6px; min-height:18px; }
  #domanda:focus { outline:none; border:2px solid var(--ciano); box-shadow:0 0 14px var(--ciano-t), 0 0 10px var(--ciano-f) inset; }
  #stato { font:12px/1 var(--mono); letter-spacing:3px; color:var(--ciano); margin:12px 0 8px; display:flex; align-items:center; gap:8px; }
  #stato::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--ciano-t),transparent); }
  #stato.errore { color:var(--rosso); }
  #conv { flex:1; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--ciano-t) transparent; padding-right:4px; }
  .scambio { margin-bottom:12px; }
  .chiesto { font:14px/1.4 var(--mono); color:var(--tenue); letter-spacing:.5px; margin-bottom:6px; }
  .chiesto::before { content:"› "; color:var(--ciano); }
  .risposto { position:relative; font-size:19px; line-height:1.4; padding:8px 12px 8px 14px; border:1px solid #ffffff12; background:linear-gradient(90deg,var(--ciano-f),transparent 80%); }
  .risposto::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ciano); box-shadow:0 0 8px var(--ciano); }
  .attesa .risposto { color:var(--tenue); font:15px/1.4 var(--mono); letter-spacing:1px; }
  #ascolta { display:none; margin-top:8px; font:600 14px/1 var(--mono); letter-spacing:2px; color:#00141c; background:var(--ciano); border:0; padding:9px 14px;
    clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }
  #ascolta.visibile { display:inline-block; }
  #ascolta:focus { outline:2px solid var(--testo); }
  footer { display:flex; justify-content:space-between; font:12px/1 var(--mono); letter-spacing:1px; color:var(--tenue); margin-top:8px; padding-top:7px; border-top:1px solid var(--ciano-f); }
  @media (prefers-reduced-motion:reduce) { .anello, .anello2 { animation:none !important; } }
  @media (max-width:420px) { html, body { font-size:17px; } #app { padding:12px; } }
</style>
<script src="../comune/saluto.js"></script>
</head>
<body>
<div id="app">
  <header>
    <svg class="reattore" viewBox="0 0 54 54" aria-hidden="true">
      <circle cx="27" cy="27" r="25" fill="none" stroke="#3fd4ff55" stroke-width="1"/>
      <circle class="anello" cx="27" cy="27" r="21" fill="none" stroke="#3fd4ff" stroke-width="2.5" stroke-dasharray="10 5"/>
      <circle class="anello2" cx="27" cy="27" r="15" fill="none" stroke="#3fd4ffaa" stroke-width="1.5" stroke-dasharray="3 4"/>
      <circle cx="27" cy="27" r="8" fill="#3fd4ff33" stroke="#3fd4ff" stroke-width="2"/>
      <circle cx="27" cy="27" r="3" fill="#e8f7ff"/>
    </svg>
    <div class="marchio"><h1>J.A.R.V.I.S.</h1><div class="sotto">PARLA · SOLA LETTURA</div></div>
    <div id="ora">--:--</div>
  </header>
  <div class="riga-domanda">
    <input id="domanda" type="text" autocomplete="off" placeholder="● Scorra qui e pizzichi per parlare" aria-label="Domanda per Jarvis">
    <button id="invia" type="button">INVIA ▶</button>
  </div>
  <textarea id="domanda2" rows="1" placeholder="● Oppure qui (prova)" aria-label="Domanda per Jarvis, campo di prova"></textarea>
  <div id="ricevuto"></div>
  <div id="stato">IN ASCOLTO</div>
  <div id="conv"></div>
  <button id="ascolta" type="button">▶ ASCOLTA LA RISPOSTA</button>
  <footer><span>● PARLA · ▲▼ SCORRI</span><span id="nota">RISPONDE IL JARVIS COMPLETO</span></footer>
  <div id="diagnosi">DIAGNOSI · FUOCO: — · GESTO: — · CLIC: 0</div>
</div>
<script>
"use strict";
const URL_DATI = "https://wbcszvjszruatmpigncd.supabase.co/functions/v1/jarvis-lente";
const ATTESA_MAX = 120000;

// Chiave propria di «Parla» (ruolo «domande»): arriva una volta nell'indirizzo (#k=…) e resta sugli occhiali.
function chiave() {
  const m = location.hash.match(/k=([\w-]{20,})/);
  if (m) {
    try { localStorage.setItem("parla-k", m[1]); } catch (e) {}
    history.replaceState(null, "", location.pathname);
    return m[1];
  }
  try { return localStorage.getItem("parla-k") || ""; } catch (e) { return ""; }
}
const K = chiave();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pausa = ms => new Promise(r => setTimeout(r, ms));
let occupato = false, ultimaVoce = null, ultimoInviato = "";

function stato(testo, errore) { const s = $("stato"); s.textContent = testo; s.classList.toggle("errore", !!errore); }
function orologio() { $("ora").textContent = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }); }

function aggiungiScambio(domanda) {
  const div = document.createElement("div");
  div.className = "scambio attesa";
  div.innerHTML = `<div class="chiesto">${esc(domanda)}</div><div class="risposto">ELABORAZIONE IN CORSO…</div>`;
  $("conv").prepend(div);
  $("conv").scrollTop = 0;
  return div;
}

async function chiamata(url, opzioni = {}) {
  const r = await fetch(url, { ...opzioni, headers: { "x-lente-key": K, "content-type": "application/json", ...(opzioni.headers || {}) }, cache: "no-store" });
  if (r.status === 401) throw new Error("chiave non valida");
  if (r.status === 429) throw new Error("troppe domande: riprovi tra poco");
  if (!r.ok) throw new Error("errore " + r.status);
  return r;
}

// Domanda → coda su Supabase → Jarvis sul Mac → risposta scritta e voce.
async function chiedi(domanda) {
  domanda = String(domanda || "").trim();
  if (!domanda || occupato) return null;
  if (!K) { stato("CHIAVE ASSENTE · riaprire l'indirizzo completo", true); return null; }
  occupato = true;
  $("app").classList.add("pensa");
  $("ascolta").classList.remove("visibile");
  const scambio = aggiungiScambio(domanda);
  stato("JARVIS STA ELABORANDO…");
  try {
    const { id } = await (await chiamata(URL_DATI + "?domanda", { method: "POST", body: JSON.stringify({ testo: domanda }) })).json();
    const fine = Date.now() + ATTESA_MAX;
    while (Date.now() < fine) {
      await pausa(800);
      const r = await (await chiamata(URL_DATI + "?risposta=" + id)).json();
      if (r.stato === "scrive") {
        // Il testo arriva mentre Jarvis lo scrive.
        scambio.classList.remove("attesa");
        scambio.querySelector(".risposto").textContent = r.testo + " ▍";
        stato("JARVIS STA RISPONDENDO…");
      } else if (r.stato === "pronta") {
        scambio.classList.remove("attesa");
        scambio.querySelector(".risposto").textContent = r.risposta;
        stato(r.audio ? "RISPOSTA RICEVUTA" : "RISPOSTA RICEVUTA · VOCE IN ARRIVO");
        aspettaVoce(id, r.audio);
        return r.risposta;
      } else if (r.stato === "attesa" && Date.now() > fine - ATTESA_MAX + 30000) {
        stato("IN CODA · IL MAC È ACCESO?");
      }
    }
    throw new Error("nessuna risposta: il Mac è acceso?");
  } catch (e) {
    scambio.querySelector(".risposto").textContent = "Collegamento non riuscito, Signore.";
    stato(String(e.message).toUpperCase(), true);
    return null;
  } finally {
    occupato = false;
    $("app").classList.remove("pensa");
  }
}

// La voce arriva qualche secondo dopo il testo: si controlla ancora per 25 secondi, senza bloccare la pagina.
async function aspettaVoce(id, pronta) {
  const fine = Date.now() + 25000;
  while (!pronta && Date.now() < fine) {
    await pausa(1000);
    try { pronta = (await (await chiamata(URL_DATI + "?risposta=" + id)).json()).audio === true; } catch (e) { return; }
  }
  if (pronta) { await preparaVoce(id); stato("RISPOSTA RICEVUTA"); }
}

async function preparaVoce(id) {
  try {
    const r = await chiamata(URL_DATI + "?audio=risposta-" + id);
    ultimaVoce = new Audio(URL.createObjectURL(await r.blob()));
    await ultimaVoce.play();
  } catch (e) {
    // Senza un gesto recente gli occhiali possono bloccare l'audio: resta il pulsante per ascoltarla.
    if (ultimaVoce) { $("ascolta").classList.add("visibile"); $("ascolta").focus(); }
  }
}

// La dettatura degli occhiali consegna il testo nel campo: con «change», «input», a volte senza alcun evento.
// Per non perderlo: si ascoltano tutti gli eventi, si controlla comunque il campo due volte al secondo, si mostra
// cosa è arrivato e si invia dopo un secondo di silenzio; c'è anche il pulsante INVIA.
// Due campi (riga e area di testo): si usa quello in cui arriva la dettatura.
const campi = () => [$("domanda"), $("domanda2")];
const testoCampi = () => campi().map(c => c.value.trim()).filter(Boolean).join(" ");
function invia() {
  const t = testoCampi();
  if (!t || t === ultimoInviato || occupato) return;
  ultimoInviato = t;
  campi().forEach(c => { c.value = ""; c.blur(); });
  $("ricevuto").textContent = "";
  chiedi(t);
}
let attesaInput = null, ultimoVisto = "";
function testoArrivato(evento) {
  $("nota").textContent = "EVENTO: " + evento.toUpperCase();
  const t = testoCampi();
  if (t === ultimoVisto) return;
  ultimoVisto = t;
  $("ricevuto").textContent = t ? "RICEVUTO: " + t : "";
  clearTimeout(attesaInput);
  if (t) attesaInput = setTimeout(invia, 1000);
}
for (const c of campi()) {
  for (const ev of ["input", "change", "compositionend", "blur", "keyup"]) c.addEventListener(ev, () => testoArrivato(ev));
  c.addEventListener("keydown", e => { if (e.key === "Enter" && c.value.trim()) { e.preventDefault(); invia(); } });
  // Come la UI Toolkit di Meta: il pizzico (Enter) diventa un clic sul campo, ed è il clic che apre la dettatura.
  // Sugli occhiali arriva solo la pressione, non il rilascio: il clic parte subito.
  c.addEventListener("keydown", e => { if (e.key === "Enter" && !c.value.trim()) c.click(); });
}
setInterval(() => { if (testoCampi() !== ultimoVisto) testoArrivato("lettura"); }, 500);
$("invia").addEventListener("click", () => { if (testoCampi()) invia(); else $("ricevuto").textContent = "CAMPO VUOTO: SCORRA SUL CAMPO, PIZZICHI E DETTI"; });

// Diagnosi sugli occhiali: cosa è selezionato, quale gesto arriva, se il campo riceve il clic.
const diag = { fuoco: "—", gesto: "—", clic: 0 };
function scriviDiagnosi() { $("diagnosi").textContent = `DIAGNOSI · FUOCO: ${diag.fuoco} · GESTO: ${diag.gesto} · CLIC: ${diag.clic}`; }
document.addEventListener("focusin", e => { diag.fuoco = (e.target.id || e.target.tagName).toUpperCase(); scriviDiagnosi(); }, true);
document.addEventListener("keydown", e => { diag.gesto = e.key; scriviDiagnosi(); }, true);
for (const c of campi()) c.addEventListener("click", () => { diag.clic++; diag.gesto += " +CLIC " + c.id.toUpperCase(); scriviDiagnosi(); });
$("ascolta").addEventListener("click", () => { if (ultimaVoce) { ultimaVoce.currentTime = 0; ultimaVoce.play().catch(() => {}); } });

// Su e giù scorrono le risposte; il resto lo gestisce la navigazione degli occhiali.
document.addEventListener("keydown", e => {
  if (e.target === $("domanda") || e.target === $("domanda2")) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const c = $("conv");
    if (c.scrollHeight > c.clientHeight) { e.preventDefault(); c.scrollBy({ top: e.key === "ArrowDown" ? 90 : -90 }); }
  } else if (e.key === "Escape" || e.key === "Backspace") {
    history.back();
  }
});

// WebMCP: «Hey Meta, chiedi a Jarvis …» con l'app aperta.
function registraStrumenti() {
  const mc = document.modelContext;
  if (!mc || typeof mc.registerTool !== "function") return;
  try {
    mc.registerTool({
      name: "chiedi_a_jarvis",
      description: "Fa una domanda a Jarvis, l'assistente personale di Raffaele (vault, agenda, posta, negozio La Baronessa) e restituisce la sua risposta. Use when the user says 'chiedi a Jarvis' or asks about his own business, tasks, schedule or shop.",
      inputSchema: { type: "object", properties: { domanda: { type: "string", description: "la domanda, in italiano" } }, required: ["domanda"] },
      execute: async (input) => (await chiedi(input && input.domanda)) || "Jarvis non ha risposto in tempo.",
    });
  } catch (e) {}
}

orologio();
setInterval(orologio, 60000);
registraStrumenti();
// Niente fuoco automatico sul campo: la dettatura si apre solo se è il Signore a selezionarlo e a pizzicarlo.
JarvisSaluto({ app: "parla", chiave: K, url: URL_DATI, sotto: "CANALE VOCALE APERTO", frasi: [
  { audio: "parla-1", scritta: "Sono tutto orecchie, Signore. In senso figurato." },
  { audio: "parla-2", scritta: "Mi dica, Signore. Prometto di non giudicare la domanda." },
  { audio: "parla-3", scritta: "In ascolto, Signore. Le domande facili le lascio a Meta." },
] });
</script>
</body>
</html>
