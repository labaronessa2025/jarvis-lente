<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>SPX500</title>
<style>
  /* HUD ad anello (v5, 12/11/2026): nessun grafico. Nero = trasparente sulla lente, 600×600 senza scorrimento.
     L'anello si riempie con la variazione del giorno: verde in senso orario se sale, rosso in senso antiorario se scende; pieno = ±2%. */
  :root {
    --ciano:#3fd4ff; --ciano-t:#3fd4ff55; --ciano-f:#3fd4ff22; --testo:#e8f7ff; --tenue:#8fb3c4;
    --su:#5ef0a8; --giu:#ff5a4e; --ambra:#ffb340;
    --mono:"SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans:"SF Pro Display", -apple-system, "Roboto", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:var(--testo); font:20px/1.3 var(--sans); }
  #app { position:relative; width:100%; height:100%; }
  #anello { position:absolute; left:50%; top:calc(50% - 10px); width:min(92vw, 92vh); height:min(92vw, 92vh); transform:translate(-50%, -50%); }
  #fondo { fill:none; stroke:var(--ciano-f); stroke-width:14; }
  #arco { fill:none; stroke:var(--su); stroke-width:14; stroke-linecap:round; transition:stroke-dasharray .6s ease, stroke .3s; filter:drop-shadow(0 0 8px currentColor); }
  #zero { stroke:var(--tenue); stroke-width:2; }
  #centro { position:absolute; left:0; right:0; top:calc(50% - 10px); transform:translateY(-50%); text-align:center; }
  .lab { font:600 15px/1 var(--mono); letter-spacing:3px; color:var(--tenue); }
  #prezzo { margin-top:20px; font:700 84px/1 var(--mono); letter-spacing:-2px; text-shadow:0 0 18px var(--ciano-t); }
  #variazione { margin-top:16px; font:700 34px/1 var(--mono); color:var(--tenue); }
  #variazione.su { color:var(--su); text-shadow:0 0 12px #5ef0a855; }
  #variazione.giu { color:var(--giu); text-shadow:0 0 12px #ff5a4e55; }
  #stato { margin:26px auto 0; max-width:380px; font:600 15px/1.3 var(--mono); letter-spacing:3px; color:var(--tenue); }
  #scala { position:absolute; left:0; right:0; bottom:14px; text-align:center; }
  .led { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--su); box-shadow:0 0 6px var(--su); margin-right:8px; vertical-align:1px; }
  .led.fermo { background:var(--ambra); box-shadow:0 0 6px var(--ambra); }
  .led.spento { background:var(--giu); box-shadow:0 0 6px var(--giu); }
  #demo { color:var(--ambra); }
</style>
<script src="../comune/saluto.js"></script>
</head>
<body>
<div id="app">
  <svg id="anello" viewBox="0 0 520 520" aria-hidden="true">
    <circle id="fondo" cx="260" cy="260" r="230"/>
    <circle id="arco" cx="260" cy="260" r="230" stroke-dasharray="0 1446" transform="rotate(-90 260 260)"/>
    <line id="zero" x1="260" y1="16" x2="260" y2="44"/>
  </svg>
  <div id="centro">
    <div class="lab">SPX500</div>
    <div id="prezzo">—</div>
    <div id="variazione">&nbsp;</div>
    <div id="stato"><span class="led spento"></span>COLLEGAMENTO…</div>
  </div>
  <div id="scala" class="lab">ANELLO PIENO = ±2%</div>
</div>
<script>
"use strict";
// SPX500 su eToro, sulla lente. I numeri arrivano dalla funzione Supabase jarvis-etoro (le chiavi eToro restano lì);
// la pagina li chiede ogni 3 s solo mentre è aperta. Nessun ordine, nessun dato del conto: solo il prezzo.
const URL_PREZZO = "https://wbcszvjszruatmpigncd.supabase.co/functions/v1/jarvis-etoro";
const URL_DATI = "https://wbcszvjszruatmpigncd.supabase.co/functions/v1/jarvis-lente";   // solo per la voce del saluto
const PASSO_MS = 3000;
const RITARDO_MS = 3 * 60 * 1000;   // la v2 di eToro aggiorna l'orario una volta al minuto: oltre 3 minuti il dato è vecchio
const SCALA_PCT = 2;   // anello pieno = ±2% dalla chiusura
const GIRO = 2 * Math.PI * 230;
const DEMO = /[?&]demo\b/.test(location.search);
const $ = id => document.getElementById(id);
const VERSIONE = "v5";
// La chiave arriva nell'indirizzo (#k=… o ?k=…, perché l'app Meta AI può scartare la parte dopo #) e si salva sugli occhiali.
const K = (() => {
  const m = (location.hash + "&" + location.search).match(/k=([\w-]{20,})/);
  if (m) {
    try { localStorage.setItem("lente-k", m[1]); } catch (e) {}
    history.replaceState(null, "", location.pathname + (DEMO ? "?demo" : ""));
    return m[1];
  }
  try { return localStorage.getItem("lente-k") || ""; } catch (e) { return ""; }
})();

// Formato italiano con il punto delle migliaia sempre (toLocaleString in it-IT lo omette sotto le 10.000).
const num = (n, d = 2) => {
  if (n == null || !isFinite(n)) return "—";
  const [i, f] = Math.abs(n).toFixed(d).split(".");
  return (n < 0 ? "-" : "") + i.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (f ? "," + f : "");
};
const segno = n => (n > 0 ? "+" : n < 0 ? "−" : "") + num(Math.abs(n));

try { localStorage.removeItem("spx-storia-v4"); } catch (e) {}   // storia del vecchio grafico, non serve più

let ultimo = null, inLinea = false, errore = "";
async function aggiorna() {
  try {
    const d = DEMO ? demo() : await (async () => {
      if (!K) throw new Error(`chiave assente · ${VERSIONE} · ${location.hash ? "#" : "-"}${location.search ? "?" : "-"}`);
      const r = await fetch(URL_PREZZO, { headers: { "x-lente-key": K }, cache: "no-store" });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.errore || "errore " + r.status);
      return j;
    })();
    // Una nuova istanza della funzione può rispondere senza chiusura: si tiene l'ultima nota.
    if (d.chiusura == null && ultimo && ultimo.chiusura != null) {
      d.chiusura = ultimo.chiusura; d.variazione = d.prezzo - d.chiusura; d.variazione_pct = d.variazione / d.chiusura * 100;
    }
    if (d.aperto == null && ultimo) d.aperto = ultimo.aperto;
    ultimo = d; inLinea = true; errore = "";
  } catch (e) {
    inLinea = false; errore = String(e.message || e).toUpperCase();
  }
  disegna();
}

function disegna() {
  const ora = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const d = ultimo;
  if (d) {
    $("prezzo").textContent = num(d.prezzo);
    const v = $("variazione");
    v.className = d.variazione > 0 ? "su" : d.variazione < 0 ? "giu" : "";
    v.textContent = d.variazione == null ? "VARIAZIONE N/D" : `${segno(d.variazione)} · ${segno(d.variazione_pct)}%`;
    // Anello: frazione della variazione su ±2%; in salita orario, in discesa antiorario (specchiato).
    const pct = d.variazione_pct;
    const f = pct == null || !isFinite(pct) ? 0 : Math.min(Math.abs(pct) / SCALA_PCT, 1);
    const arco = $("arco");
    arco.setAttribute("stroke-dasharray", `${(f * GIRO).toFixed(1)} ${GIRO.toFixed(1)}`);
    arco.style.stroke = arco.style.color = pct < 0 ? "var(--giu)" : "var(--su)";
    arco.setAttribute("transform", pct < 0 ? "rotate(-90 260 260) scale(1 -1) translate(0 -520)" : "rotate(-90 260 260)");
  }
  // Stato: eToro dice se il mercato è aperto; se è aperto ma l'orario della quotazione è vecchio, il dato è in ritardo.
  const eta = d ? Date.now() - (Date.parse(d.data) || Date.now()) : 0;
  const chiuso = d && d.aperto === false;
  const ritardo = d && !chiuso && eta > RITARDO_MS;
  const led = !inLinea ? "spento" : chiuso || ritardo ? "fermo" : "";
  const testo = !inLinea ? (errore || "COLLEGAMENTO…") : chiuso ? "MERCATO CHIUSO"
    : ritardo ? `IN RITARDO · ${Math.round(eta / 60000)} MIN` : "IN DIRETTA";
  $("stato").innerHTML = `<span class="led ${led}"></span>${testo} · ${ora}${DEMO ? ' · <span id="demo">DEMO</span>' : ""}`;
}

// DEMO: passeggiata casuale, mai presentata come dato vero (scritta DEMO in basso).
let pd = 6850;
function demo() {
  pd += (Math.random() - 0.48) * 2.2;
  const c = 6812.4;
  const t15 = new Date(Math.floor(Date.now() / 900000) * 900000).toISOString();
  return { simbolo: "SPX500", prezzo: pd, bid: pd, ask: pd + 0.4, data: new Date().toISOString(), aperto: true,
    candela15: { inizio: t15, apertura: pd - 3, massimo: pd + 1.5, minimo: pd - 4, chiusura: pd },
    chiusura: c, variazione: pd - c, variazione_pct: (pd - c) / c * 100 };
}
// WebMCP: «Hey Meta, quanto fa l'S&P 500?» con l'app aperta.
(function registraStrumenti() {
  const mc = document.modelContext;
  if (!mc || typeof mc.registerTool !== "function") return;
  try {
    mc.registerTool({
      name: "prezzo_spx500",
      description: "Prezzo attuale di SPX500 (indice S&P 500) su eToro e variazione del giorno. Use for 'quanto fa l'S&P', 'come va la borsa americana', 'prezzo SPX'.",
      inputSchema: { type: "object", properties: {} },
      execute: async () => {
        if (!ultimo) await aggiorna();
        if (!ultimo) return "Prezzo non disponibile in questo momento.";
        return `SPX500 su eToro: ${num(ultimo.prezzo)}` + (ultimo.variazione == null ? "." : `, ${segno(ultimo.variazione)} punti (${segno(ultimo.variazione_pct)}%) dalla chiusura.`);
      },
    });
  } catch (e) {}
})();

let timer = 0;
function avvia() { clearInterval(timer); aggiorna(); timer = setInterval(aggiorna, PASSO_MS); }
document.addEventListener("visibilitychange", () => { if (document.hidden) clearInterval(timer); else avvia(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" || e.key === "Backspace") history.back(); else if (e.key === "Enter") aggiorna(); });
disegna();
avvia();
JarvisSaluto({ app: "spx500", chiave: K, url: URL_DATI, sotto: "MERCATI · SOLA LETTURA", frasi: [
  { audio: "spx500-1", scritta: "Mercati in vista, Signore. Io osservo, lei decide." },
  { audio: "spx500-2", scritta: "S&P 500 sulla lente. Le candele, per fortuna, non sono di cera." },
  { audio: "spx500-3", scritta: "Wall Street in diretta, Signore. Il caffè resta a carico suo." },
] });
</script>
</body>
</html>
